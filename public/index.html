<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Commentaire d'Arrêt · IA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ─────────────────────────────────────────────────────────── */
    :root {
      --ink:       #1a1610;
      --ink-soft:  #4a4030;
      --ink-muted: #8a7a6a;
      --parchment: #f7f3ec;
      --gold:      #b8913a;
      --red-law:   #8b1a1a;
      --border:    rgba(26,22,16,0.12);
      --shadow:    0 2px 24px rgba(26,22,16,0.07);
      --radius:    2px;
    }

    /* ── Reset ─────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Libre Baskerville', Georgia, serif;
      background: var(--parchment);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
      background: linear-gradient(to bottom, #f0ebe1, var(--parchment));
    }

    .header-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.15;
    }

    h1 em { font-style: italic; color: var(--red-law); }

    .subtitle {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--ink-muted);
      font-style: italic;
    }

    /* ── Main ──────────────────────────────────────────────────────────────── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Card ──────────────────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    /* ── Fields ────────────────────────────────────────────────────────────── */
    .field { margin-bottom: 1rem; }
    .field:last-of-type { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.45rem;
    }

    .field-optional {
      font-style: italic;
      text-transform: none;
      letter-spacing: 0;
      margin-left: 0.3rem;
    }

    .field input[type="text"] {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.7rem 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .field input[type="text"]::placeholder { color: var(--ink-muted); opacity: 0.6; }

    .field input[type="text"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,145,58,0.12);
    }

    /* ── Judilibre notice ──────────────────────────────────────────────────── */
    .judilibre-notice {
      margin-top: 0.9rem;
      padding: 0.75rem 1rem;
      background: #f5f0e8;
      border-left: 3px solid var(--gold);
      border-radius: var(--radius);
      font-size: 0.78rem;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    .judilibre-notice strong { color: var(--ink); }
    .judilibre-notice a { color: var(--red-law); text-underline-offset: 2px; }

    /* ── Button ────────────────────────────────────────────────────────────── */
    #generate-btn {
      width: 100%;
      margin-top: 1.25rem;
      font-family: 'Libre Baskerville', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: var(--ink);
      border: none;
      border-radius: var(--radius);
      padding: 0.9rem 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      -webkit-appearance: none;
    }

    #generate-btn:hover:not(:disabled) { background: var(--red-law); }
    #generate-btn:active:not(:disabled) { transform: scale(0.98); }
    #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Loading ───────────────────────────────────────────────────────────── */
    #loading {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
      animation: fadeUp 0.3s ease;
    }

    .loading-icon {
      display: inline-block;
      font-size: 1.8rem;
      color: var(--gold);
      animation: spin 3s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-steps {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--ink-muted);
      font-style: italic;
    }

    .loading-step { padding: 0.15rem 0; opacity: 0.4; transition: opacity 0.4s; }
    .loading-step.active { opacity: 1; color: var(--ink-soft); }

    /* ── Error ─────────────────────────────────────────────────────────────── */
    #error-box {
      display: none;
      border-left: 3px solid var(--red-law);
      background: #fff5f5;
      padding: 0.9rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      color: var(--red-law);
      animation: fadeUp 0.3s ease;
      border-radius: var(--radius);
    }

    /* ── Result ────────────────────────────────────────────────────────────── */
    #result-section { display: none; animation: fadeUp 0.5s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .result-id {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    .result-id strong {
      font-family: 'JetBrains Mono', monospace;
      color: var(--red-law);
      font-weight: 400;
    }

    #copy-btn {
      font-family: 'Libre Baskerville', serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.35rem 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      -webkit-appearance: none;
    }

    #copy-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
    #copy-btn.copied { background: #2d7a4f; color: #fff; border-color: #2d7a4f; }

    /* ── Texte du commentaire ──────────────────────────────────────────────── */
    #result-content {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
      line-height: 1.9;
      font-size: 0.93rem;
      color: var(--ink);
    }

    #result-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 2rem 0 0.6rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
    }

    #result-content h3 {
      font-family: 'Playfair Display', serif;
      font-size: 0.97rem;
      font-weight: 700;
      font-style: italic;
      color: var(--ink-soft);
      margin: 1.4rem 0 0.4rem;
    }

    #result-content p {
      margin-bottom: 0.9rem;
      text-align: justify;
      hyphens: auto;
    }

    #result-content p:last-child { margin-bottom: 0; }
    #result-content strong { font-weight: 700; }
    #result-content em { font-style: italic; }

    /* ── Footer ────────────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.72rem;
      color: var(--ink-muted);
      border-top: 1px solid var(--border);
      font-style: italic;
    }

    /* ════════════════════════════════════════════════════════════════════════
       APPLE WATCH — watchOS 8 · WebKit · viewport ~197px
       OPTIMISATION TOTALE — Densité maximale, contraste infini
    ════════════════════════════════════════════════════════════════════════ */
    @media (max-width: 220px) {
      html, body {
        background: #000 !important;
        color: #fff !important;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif !important;
        font-size: 12px !important;
        overflow-x: hidden;
      }

      header {
        padding: 5px 2px !important;
        background: #000 !important;
        border-bottom: 1px solid #444 !important;
      }

      h1 {
        font-size: 13px !important;
        font-weight: 800 !important;
        color: #fff !important;
      }

      main { padding: 4px !important; }

      .card {
        padding: 6px !important;
        margin-bottom: 4px !important;
        background: #000 !important;
        border: 1px solid #333 !important;
      }

      .field-label {
        font-size: 10px !important;
        color: #ff9f0a !important; /* Orange Apple Watch */
        margin-bottom: 2px !important;
      }

      .field input[type="text"] {
        font-size: 13px !important;
        min-height: 34px !important;
        background: #1c1c1e !important;
        color: #fff !important;
        border: 1px solid #3a3a3c !important;
      }

      #generate-btn {
        min-height: 40px !important;
        font-size: 12px !important;
        background: #ff3b30 !important; /* Rouge vif Apple */
        font-weight: bold !important;
      }

      #result-content {
        padding: 8px 6px !important;
        font-size: 12px !important;
        line-height: 1.4 !important;
        background: #000 !important;
        border: 1px solid #333 !important;
      }

      #result-content h2 {
        font-size: 12px !important;
        color: #ff9f0a !important;
        margin-top: 10px !important;
        border-bottom: 1px solid #333 !important;
      }

      #result-content h3 { font-size: 12px !important; color: #64d2ff !important; }
      #result-content p { margin-bottom: 6px !important; }

      .result-bar { border-bottom: 1px solid #333; padding-bottom: 4px; }
      #copy-btn { display: none !important; } /* Inutile sur Watch */
      
      .header-eyebrow, .subtitle, footer, .judilibre-notice { display: none !important; }
    }

    /* ── Mobile standard ───────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      main { padding: 1.5rem 1rem 4rem; }
      #result-content { padding: 1.5rem; }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-eyebrow">Droit Civil · Droit des Obligations</div>
    <h1>Générateur de<br><em>Commentaire d'Arrêt</em></h1>
    <p class="subtitle">Intelligence artificielle · Cour de cassation</p>
  </header>

  <main>

    <div class="card">

      <!-- Chambre (optionnel) -->
      <div class="field">
        <label class="field-label" for="chambre-input">
          Chambre <span class="field-optional">(optionnel)</span>
        </label>
        <input
          type="text"
          id="chambre-input"
          placeholder="Ex : Civ. 1, Com., Soc., Crim."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Date (optionnel) -->
      <div class="field">
        <label class="field-label" for="date-input">
          Date de l'arrêt <span class="field-optional">(optionnel)</span>
        </label>
        <input
          type="text"
          id="date-input"
          placeholder="Ex : 24 novembre 1998"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Numéro de pourvoi (obligatoire) -->
      <div class="field">
        <label class="field-label" for="pourvoi-input">Numéro de pourvoi</label>
        <input
          type="text"
          id="pourvoi-input"
          placeholder="Ex : 21-15.123"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <button id="generate-btn">
        <span>⚖</span> Générer le commentaire
      </button>

    </div>

    <!-- Loading -->
    <div id="loading">
      <span class="loading-icon">⚖</span>
      <div class="loading-steps">
        <div class="loading-step" id="step-1">① Recherche sur Judilibre…</div>
        <div class="loading-step" id="step-2">② Transmission à Gemini…</div>
        <div class="loading-step" id="step-3">③ Rédaction du commentaire…</div>
      </div>
    </div>

    <!-- Erreur -->
    <div id="error-box" role="alert"></div>

    <!-- Résultat -->
    <section id="result-section" aria-live="polite">
      <div class="result-bar">
        <div class="result-id">
          <strong id="result-chambre"></strong> · <strong id="result-date"></strong><br>
          Pourvoi n° <strong id="result-pourvoi"></strong>
        </div>
        <button id="copy-btn">📋 Copier</button>
      </div>
      <div id="result-content"></div>
    </section>

  </main>

  <footer>
    Outil pédagogique · Ne constitue pas un avis juridique.
  </footer>

  <script>
    var inputPourvoi  = document.getElementById('pourvoi-input');
    var inputChambre  = document.getElementById('chambre-input');
    var inputDate     = document.getElementById('date-input');
    var btn           = document.getElementById('generate-btn');
    var loading       = document.getElementById('loading');
    var errorBox      = document.getElementById('error-box');
    var resultSec     = document.getElementById('result-section');
    var resultDiv     = document.getElementById('result-content');
    var resultPourvoi = document.getElementById('result-pourvoi');
    var resultChambre = document.getElementById('result-chambre');
    var resultDate    = document.getElementById('result-date');
    var copyBtn       = document.getElementById('copy-btn');
    var steps         = [
      document.getElementById('step-1'),
      document.getElementById('step-2'),
      document.getElementById('step-3')
    ];
    var stepTimer = null;

    // Entrée clavier sur tous les champs
    [inputPourvoi, inputChambre, inputDate].forEach(function(el) {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') generate();
      });
    });

    btn.addEventListener('click', generate);

    function generate() {
      var pourvoi = inputPourvoi.value.trim();
      var chambre = inputChambre.value.trim();
      var date    = inputDate.value.trim();

      if (!pourvoi) {
        showError('Veuillez saisir un numéro de pourvoi.');
        inputPourvoi.focus();
        return;
      }

      setLoading(true);
      hideError();
      hideResult();

      fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pourvoi: pourvoi, chambre: chambre, date: date })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.error || 'Erreur serveur.');
          return data;
        });
      })
      .then(function(data) {
        displayResult(pourvoi, chambre, date, data.commentary);
      })
      .catch(function(err) {
        showError(err.message || 'Une erreur inattendue est survenue.');
      })
      .finally(function() {
        setLoading(false);
      });
    }

    function displayResult(pourvoi, chambre, date, text) {
      resultPourvoi.textContent = pourvoi;
      resultChambre.textContent = chambre || '—';
      resultDate.textContent    = date    || 'date non renseignée';
      resultDiv.innerHTML       = formatMarkdown(text);
      resultSec.style.display   = 'block';
      setTimeout(function() {
        resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function formatMarkdown(text) {
      var html = text.replace(/\r\n/g, '\n');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm,   '<h2>$1</h2>');
      html = html.replace(/^\*\*([^*\n]+)\*\*\s*$/gm, '<h2>$1</h2>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/_(.+?)_/g, '<em>$1</em>');
      var blocks = html.split(/\n{2,}/);
      html = blocks.map(function(block) {
        block = block.trim();
        if (!block) return '';
        if (/^<h[23]>/.test(block)) return block;
        block = block.replace(/\n/g, ' ');
        return '<p>' + block + '</p>';
      }).join('\n');
      return html;
    }

    copyBtn.addEventListener('click', function() {
      var text = resultDiv.innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
      } else {
        fallbackCopy(text);
      }
      copyBtn.textContent = '✅ Copié !';
      copyBtn.classList.add('copied');
      setTimeout(function() {
        copyBtn.innerHTML = '📋 Copier';
        copyBtn.classList.remove('copied');
      }, 2000);
    });

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    function setLoading(active) {
      loading.style.display = active ? 'block' : 'none';
      btn.disabled = active;
      btn.innerHTML = active ? '<span>⏳</span> Génération…' : '<span>⚖</span> Générer le commentaire';
      if (active) {
        steps.forEach(function(s) { s.classList.remove('active'); });
        steps[0].classList.add('active');
        var i = 0;
        stepTimer = setInterval(function() {
          i = Math.min(i + 1, steps.length - 1);
          steps.forEach(function(s) { s.classList.remove('active'); });
          steps[i].classList.add('active');
        }, 4000);
      } else {
        clearInterval(stepTimer);
        steps.forEach(function(s) { s.classList.remove('active'); });
      }
    }

    function showError(msg) {
      errorBox.textContent = '⚠ ' + msg;
      errorBox.style.display = 'block';
    }

    function hideError()  { errorBox.style.display  = 'none'; }
    function hideResult() { resultSec.style.display = 'none'; }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Dissertation Juridique · Droit Administratif</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ─────────────────────────────────────────────────────────── */
    :root {
      --ink:       #1a1610;
      --ink-soft:  #4a4030;
      --ink-muted: #8a7a6a;
      --parchment: #f7f3ec;
      --gold:      #b8913a;
      --red-law:   #8b1a1a;
      --border:    rgba(26,22,16,0.12);
      --shadow:    0 2px 24px rgba(26,22,16,0.07);
      --radius:    2px;
    }

    /* ── Reset ─────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Libre Baskerville', Georgia, serif;
      background: var(--parchment);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
      background: linear-gradient(to bottom, #f0ebe1, var(--parchment));
    }

    .header-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.15;
    }

    h1 em { font-style: italic; color: var(--red-law); }

    .subtitle {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--ink-muted);
      font-style: italic;
    }

    /* ── Main ──────────────────────────────────────────────────────────────── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Card ──────────────────────────────────────────────────────────────── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    /* ── Fields ────────────────────────────────────────────────────────────── */
    .field { margin-bottom: 1rem; }
    .field:last-of-type { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.45rem;
    }

    .field textarea {
      width: 100%;
      min-height: 100px;
      font-family: 'Libre Baskerville', serif;
      font-size: 1.1rem;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.7rem 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }

    .field textarea::placeholder { color: var(--ink-muted); opacity: 0.6; }

    .field textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(184,145,58,0.12);
    }

    /* ── Button ────────────────────────────────────────────────────────────── */
    #generate-btn {
      width: 100%;
      margin-top: 1.25rem;
      font-family: 'Libre Baskerville', serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: var(--ink);
      border: none;
      border-radius: var(--radius);
      padding: 0.9rem 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      -webkit-appearance: none;
    }

    #generate-btn:hover:not(:disabled) { background: var(--red-law); }
    #generate-btn:active:not(:disabled) { transform: scale(0.98); }
    #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Loading ───────────────────────────────────────────────────────────── */
    #loading {
      display: none;
      text-align: center;
      padding: 2.5rem 1rem;
      animation: fadeUp 0.3s ease;
    }

    .loading-icon {
      display: inline-block;
      font-size: 1.8rem;
      color: var(--gold);
      animation: spin 3s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-steps {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--ink-muted);
      font-style: italic;
    }

    .loading-step { padding: 0.15rem 0; opacity: 0.4; transition: opacity 0.4s; }
    .loading-step.active { opacity: 1; color: var(--ink-soft); }

    /* ── Error ─────────────────────────────────────────────────────────────── */
    #error-box {
      display: none;
      border-left: 3px solid var(--red-law);
      background: #fff5f5;
      padding: 0.9rem 1.1rem;
      margin-bottom: 1.5rem;
      font-size: 0.88rem;
      color: var(--red-law);
      animation: fadeUp 0.3s ease;
      border-radius: var(--radius);
    }

    /* ── Result ────────────────────────────────────────────────────────────── */
    #result-section { display: none; animation: fadeUp 0.5s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .result-id {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    #copy-btn {
      font-family: 'Libre Baskerville', serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.35rem 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      -webkit-appearance: none;
    }

    #copy-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
    #copy-btn.copied { background: #2d7a4f; color: #fff; border-color: #2d7a4f; }

    /* ── Texte de la dissertation ────────────────────────────────────────── */
    #result-content {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow);
      line-height: 1.9;
      font-size: 0.93rem;
      color: var(--ink);
    }

    # result-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      padding: 0.8rem 1rem;
      background: #f8f4f0;
      border-left: 5px solid var(--red-law);
      color: var(--ink);
    }

    # result-content h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--red-law);
      margin: 1.8rem 0 0.8rem;
      padding-bottom: 0.2rem;
      border-bottom: 1px solid var(--border);
    }

    #result-content p {
      margin-bottom: 0.9rem;
      text-align: justify;
      hyphens: auto;
    }

    #result-content p:last-child { margin-bottom: 0; }
    #result-content strong { font-weight: 700; }
    #result-content em { font-style: italic; }

    /* ── Footer ────────────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.72rem;
      color: var(--ink-muted);
      border-top: 1px solid var(--border);
      font-style: italic;
    }

    /* ── Mobile standard ───────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      main { padding: 1.5rem 1rem 4rem; }
      #result-content { padding: 1.5rem; }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-eyebrow">Droit Public · Droit Administratif</div>
    <h1>Générateur de<br><em>Dissertation Juridique</em></h1>
    <p class="subtitle">Intelligence artificielle · Méthode académique</p>
  </header>

  <main>

    <div class="card">
      <div class="field">
        <label class="field-label" for="sujet-input">Sujet de dissertation</label>
        <textarea
          id="sujet-input"
          placeholder="Ex : La dualité de la juridiction administrative : héritage historique ou nécessité moderne ?"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
      </div>

      <button id="generate-btn">
        <span>🏛️</span> Générer la dissertation
      </button>
    </div>

    <!-- Loading -->
    <div id="loading">
      <span class="loading-icon">⚖</span>
      <div class="loading-steps">
        <div class="loading-step" id="step-1">① Analyse du sujet…</div>
        <div class="loading-step" id="step-2">② Recherche des références (CE, TC)…</div>
        <div class="loading-step" id="step-3">③ Rédaction académique…</div>
      </div>
    </div>

    <!-- Erreur -->
    <div id="error-box" role="alert"></div>

    <!-- Résultat -->
    <section id="result-section" aria-live="polite">
      <div class="result-bar">
        <div class="result-id">
          Sujet : <strong id="result-sujet-display"></strong>
        </div>
        <button id="copy-btn">📋 Copier</button>
      </div>
      <div id="result-content"></div>
    </section>

  </main>

  <footer>
    Outil pédagogique · Spécialité Droit Administratif.
  </footer>

  <script>
    var inputSujet    = document.getElementById('sujet-input');
    var btn           = document.getElementById('generate-btn');
    var loading       = document.getElementById('loading');
    var errorBox      = document.getElementById('error-box');
    var resultSec     = document.getElementById('result-section');
    var resultDiv     = document.getElementById('result-content');
    var resultSujet   = document.getElementById('result-sujet-display');
    var copyBtn       = document.getElementById('copy-btn');
    var steps         = [
      document.getElementById('step-1'),
      document.getElementById('step-2'),
      document.getElementById('step-3')
    ];
    var stepTimer = null;

    btn.addEventListener('click', generate);

    function generate() {
      var sujet = inputSujet.value.trim();

      if (sujet.length < 5) {
        showError('Veuillez saisir un sujet de dissertation valide.');
        inputSujet.focus();
        return;
      }

      setLoading(true);
      hideError();
      hideResult();

      fetch('/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sujet: sujet })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          if (!res.ok) throw new Error(data.error || 'Erreur serveur.');
          return data;
        });
      })
      .then(function(data) {
        displayResult(sujet, data.dissertation);
      })
      .catch(function(err) {
        showError(err.message || 'Une erreur inattendue est survenue.');
      })
      .finally(function() {
        setLoading(false);
      });
    }

    function displayResult(sujet, text) {
      resultSujet.textContent = sujet.length > 50 ? sujet.substring(0, 47) + '...' : sujet;
      resultDiv.innerHTML     = formatMarkdown(text);
      resultSec.style.display = 'block';
      setTimeout(function() {
        resultSec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function formatMarkdown(text) {
      var html = text.replace(/\r\n/g, '\n');
      
      // Titres
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm,   '<h2>$1</h2>');
      
      // Gras et Italique
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      
      // Listes à puces
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

      var blocks = html.split(/\n{2,}/);
      html = blocks.map(function(block) {
        block = block.trim();
        if (!block) return '';
        if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) return block;
        return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');
      
      return html;
    }

    copyBtn.addEventListener('click', function() {
      var text = resultDiv.innerText;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
      } else {
        fallbackCopy(text);
      }
      copyBtn.textContent = '✅ Copié !';
      copyBtn.classList.add('copied');
      setTimeout(function() {
        copyBtn.innerHTML = '📋 Copier';
        copyBtn.classList.remove('copied');
      }, 2000);
    });

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    function setLoading(active) {
      loading.style.display = active ? 'block' : 'none';
      btn.disabled = active;
      btn.innerHTML = active ? '<span>⏳</span> Génération…' : '<span>🏛️</span> Générer la dissertation';
      if (active) {
        steps.forEach(function(s) { s.classList.remove('active'); });
        steps[0].classList.add('active');
        var i = 0;
        stepTimer = setInterval(function() {
          i = Math.min(i + 1, steps.length - 1);
          steps.forEach(function(s) { s.classList.remove('active'); });
          steps[i].classList.add('active');
        }, 4000);
      } else {
        clearInterval(stepTimer);
        steps.forEach(function(s) { s.classList.remove('active'); });
      }
    }

    function showError(msg) {
      errorBox.textContent = '⚠ ' + msg;
      errorBox.style.display = 'block';
    }

    function hideError()  { errorBox.style.display  = 'none'; }
    function hideResult() { resultSec.style.display = 'none'; }
  </script>

</body>
</html>
